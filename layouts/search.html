{{- define "main" }}
<div class="page-head">
  <h1>搜索</h1>
  <div class="desc">输入关键词，检索全部博文的标题与正文。</div>
</div>

<div class="article">
  <div id="searchbox">
    <input id="searchInput" disabled placeholder="输入关键词后自动搜索..." aria-label="搜索" type="search"
      autocomplete="off" maxlength="64">
  </div>
  <ul id="searchResults" class="searchResults" aria-label="搜索结果"></ul>
</div>

<script>
  window.addEventListener("load", function () {
    var q = new URLSearchParams(window.location.search).get("q");
    var input = document.getElementById("searchInput");
    if (q && input) {
      input.value = q;
      input.dispatchEvent(new Event("input"));
    }
  });
</script>
{{- end }}{{/* end main */}}
