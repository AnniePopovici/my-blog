{{- define "main" }}
<div class="page-head">
  <h1>{{ .Title }}</h1>
  <div class="desc">共 {{ len .Data.Terms }} 个分类</div>
</div>

<div class="article">
  <ul class="terms-tags">
    {{- range .Data.Terms.Alphabetical }}
    {{- $count := .Count }}
    {{- with .Page }}
    <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }} <sup>{{ $count }}</sup></a></li>
    {{- end }}
    {{- end }}
  </ul>
</div>
{{- end }}{{/* end main */}}
