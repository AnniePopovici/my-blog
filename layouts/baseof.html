<!DOCTYPE html>
<html lang="{{ site.Language }}" dir="ltr" data-theme="light">

<head>
    {{- partial "head.html" . }}
</head>

<body id="top">
    {{- partial "header.html" . -}}

    <div class="wrap">
        <div class="layout">
            <aside class="sidebar">
                {{- partial "sidebar.html" . -}}
            </aside>
            <main class="main-col">
                {{- block "main" . }}{{ end }}
            </main>
        </div>
    </div>

    {{ partialCached "footer.html" . .Layout .Kind (.Param "hideFooter") -}}
</body>

</html>
