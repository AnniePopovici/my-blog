{{- with site.Taxonomies.tags }}
<div class="card">
    <div class="card-head">博客分类</div>
    <div class="card-body tight">
        <ul class="cat-list">
            {{- range first 12 .ByCount }}
            {{- $count := .Count }}
            {{- with .Page }}
            <li>
                <a href="{{ .RelPermalink }}">
                    <span class="ico"></span>{{ .LinkTitle }}<span class="num">({{ $count }})</span>
                </a>
            </li>
            {{- end }}
            {{- end }}
        </ul>
    </div>
    {{- with site.GetPage "/tags" }}
    <a class="card-more" href="{{ .RelPermalink }}">&gt;&gt; 查看所有分类</a>
    {{- end }}
</div>
{{- end }}
