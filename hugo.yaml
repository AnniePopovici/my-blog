# 必须为带 https:// 的完整 URL（填你的 .pages.dev 域名或 .xyz 域名均可）
baseURL: 'https://blog.sunny2758.xyz/'

languageCode: 'zh-cn'
title: '我的个人日记本'

# 将摘要长度调极大，即使不点进详情页，首页也能直接看完整全文
summaryLength: 999999


params:
  homeInfoParams:
    title: "👋 欢迎来到我的博客"
    content: "记录生活与总结人生"

  # PaperMod 首页直接显示文章全文的原生开关
  ShowFullTextInHTML: true

  # 页面交互增强
  ShowReadingTime: true       # 显示阅读时间
  ShowWordCount: true         # 显示字数
  ShowPostNavLinks: true      # 文章底部显示“上一篇/下一篇”
