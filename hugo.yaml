# 必须为带 https:// 的完整 URL（填你的 .pages.dev 域名或 .xyz 域名均可）
baseURL: 'https://blog.sunny2758.xyz/'

languageCode: 'zh-cn'
title: '我的个人日记本'

# 摘要长度（首页由模板统一截断展示，这里保留极大值以防摘要被切）
summaryLength: 999999

# 首页每页显示的文章数
pagination:
  pagerSize: 6

# 供搜索页使用的 JSON 索引
outputs:
  home:
    - HTML
    - RSS
    - JSON

# 代码高亮使用 CSS 类，交由皮肤样式控制
markup:
  highlight:
    noClasses: false

params:
  mainSections:
    - posts

  description: '记录生活，总结人生。'
  keywords: ['日记', '随笔', '经济观察', '个人博客']

  # 界面开关
  disableThemeToggle: true      # 固定浅色，不提供深浅色切换
  defaultTheme: light
  disableScrollToTop: false
  ShowPostNavLinks: true        # 文章底部显示上一篇/下一篇
  ShowCodeCopyButtons: true     # 代码块复制按钮
  ShowShareButtons: false
  footer:
    hideCopyright: false

  # 横幅（蓝色天空图 + 楷体大标题）
  banner:
    title: '我的个人日记本'
    subtitle: '记录生活，总结人生'
