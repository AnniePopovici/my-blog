<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 152" width="1080" height="152" preserveAspectRatio="none" role="img" aria-label="蓝天草地横幅">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ec5ea"/>
      <stop offset="45%" stop-color="#bcdcf2"/>
      <stop offset="78%" stop-color="#e3f1fa"/>
      <stop offset="100%" stop-color="#f2f9fd"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8cc152"/>
      <stop offset="60%" stop-color="#6ea838"/>
      <stop offset="100%" stop-color="#527f27"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9d474"/>
      <stop offset="100%" stop-color="#8bbf57"/>
    </linearGradient>
    <radialGradient id="leaf" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#7fbc4b"/>
      <stop offset="100%" stop-color="#3f7220"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- 天空 -->
  <rect width="1080" height="152" fill="url(#sky)"/>

  <!-- 云 -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="180" cy="34" rx="52" ry="14"/>
    <ellipse cx="215" cy="27" rx="34" ry="12"/>
    <ellipse cx="150" cy="28" rx="28" ry="10"/>
    <ellipse cx="640" cy="26" rx="60" ry="12"/>
    <ellipse cx="676" cy="20" rx="34" ry="10"/>
    <ellipse cx="905" cy="42" rx="46" ry="11"/>
    <ellipse cx="935" cy="35" rx="28" ry="9"/>
  </g>

  <!-- 远山 -->
  <path d="M0 112 C 120 92, 210 118, 320 106 C 430 94, 520 116, 640 104 C 760 92, 860 116, 980 104 L 1080 110 L 1080 152 L 0 152 Z" fill="#b6dc8a" opacity="0.9"/>

  <!-- 草地 -->
  <path d="M0 122 C 160 108, 300 132, 460 122 C 620 112, 780 134, 940 122 L 1080 118 L 1080 152 L 0 152 Z" fill="url(#hill)"/>
  <path d="M0 136 C 200 126, 380 144, 560 136 C 740 128, 900 146, 1080 136 L 1080 152 L 0 152 Z" fill="url(#grass)"/>

  <!-- 树 -->
  <g transform="translate(902,0)">
    <ellipse cx="34" cy="132" rx="46" ry="8" fill="#3f6b20" opacity="0.35" filter="url(#soft)"/>
    <path d="M28 132 C 30 112, 26 96, 22 84 L 46 84 C 42 98, 40 114, 42 132 Z" fill="#7a5230"/>
    <path d="M33 96 C 20 88, 10 82, 4 74" stroke="#7a5230" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M36 100 C 48 90, 56 84, 62 76" stroke="#7a5230" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g fill="url(#leaf)">
      <ellipse cx="34" cy="52" rx="46" ry="30"/>
      <ellipse cx="8" cy="66" rx="26" ry="18"/>
      <ellipse cx="62" cy="66" rx="26" ry="18"/>
      <ellipse cx="24" cy="34" rx="24" ry="18"/>
      <ellipse cx="50" cy="36" rx="22" ry="16"/>
    </g>
    <g fill="#89c657" opacity="0.5">
      <ellipse cx="22" cy="42" rx="16" ry="10"/>
      <ellipse cx="48" cy="40" rx="12" ry="8"/>
    </g>
  </g>

  <!-- 近景草丛点缀 -->
  <g stroke="#4d7a22" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <path d="M120 148 C 122 140, 124 136, 128 132"/>
    <path d="M128 148 C 130 141, 134 137, 138 134"/>
    <path d="M430 150 C 432 142, 435 138, 439 134"/>
    <path d="M700 148 C 702 140, 705 136, 709 132"/>
    <path d="M1000 150 C 1002 142, 1006 138, 1010 134"/>
  </g>
</svg>
